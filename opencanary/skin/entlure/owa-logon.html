<!DOCTYPE html>
<html>
<head><title>Outlook</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</head>
<body class="signInBody">
<div class="signInHeader">Outlook</div>
<form action="/owa/auth.owa" method="POST" name="logonForm">
<input type="hidden" name="destination" value="/owa/">
<input type="hidden" name="flags" value="4">
<input type="hidden" name="forcedownlevel" value="0">
<table>
<tr><td><label for="username">User name:</label></td>
<td><input id="username" name="username" type="text" maxlength="255"></td></tr>
<tr><td><label for="password">Password:</label></td>
<td><input id="password" name="password" type="password"></td></tr>
<tr><td colspan="2"><input type="submit" value="sign in"></td></tr>
</table>
</form>
</body>
</html>
