{
  "device.node_id": "__NODE_ID__",
  "ip.ignorelist": [],

  "ftp.enabled": true,
  "ftp.port": 21,
  "ftp.banner": "FTP server ready",

  "ssh.enabled": true,
  "ssh.port": 22,
  "ssh.version": "SSH-2.0-OpenSSH_8.4p1 Debian-5",

  "telnet.enabled": true,
  "telnet.port": 23,
  "telnet.banner": "",
  "telnet.honeycreds": [
    { "username": "admin", "password": "admin" },
    { "username": "root", "password": "root" }
  ],

  "http.enabled": true,
  "http.port": 80,
  "http.banner": "Apache/2.4.57 (Debian)",
  "http.skin": "basicLogin",

  "httpproxy.enabled": true,
  "httpproxy.port": 8080,
  "httpproxy.skin": "squid",

  "mssql.enabled": true,
  "mssql.port": 1433,
  "mssql.version": "2012",

  "mysql.enabled": true,
  "mysql.port": 3306,
  "mysql.banner": "5.7.44-0ubuntu0.18.04.1",

  "rdp.enabled": true,
  "rdp.port": 3389,

  "vnc.enabled": true,
  "vnc.port": 5900,

  "redis.enabled": true,
  "redis.port": 6379,

  "git.enabled": true,
  "git.port": 9418,

  "portscan.enabled": false,

  "ntp.enabled": false,
  "snmp.enabled": false,
  "sip.enabled": false,
  "tftp.enabled": false,

  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": { "format": "%(message)s" }
      },
      "handlers": {
        "file": {
          "class": "logging.FileHandler",
          "filename": "/var/log/opencanary/opencanary.log",
          "formatter": "plain"
        }
      }
    }
  }
}
